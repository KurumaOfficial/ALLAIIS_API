<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALLAIIS browser bridge example</title>
<main>
  <h1>Browser bridge example</h1>
  <p>This page acts as the worker for the local <code>browser-echo</code> model.</p>
  <form id="connect">
    <label for="code">Browser worker code from your terminal</label>
    <input id="code" type="password" autocomplete="off" required>
    <button type="submit">Connect worker</button>
  </form>
  <button id="disconnect" type="button" hidden>Disconnect worker</button>
  <p id="status" role="status">Worker disconnected.</p>
  <script src="/worker.js" defer></script>
</main>
</html>
